<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel do Administrador | Banco de Questões CFAP·PMPA</title>
<style>
  :root{
    --paper:#eef3fa; --card-bg:#fbf8ee; --ink:#0a1220; --ink-soft:#3a4d6e;
    --olive-800:#0b2145; --olive-900:#050f24; --rule:#a9bcd6; --brass:#c8102e;
    --green:#1f6b4a; --green-bg:#dcede3; --red:#8c2f24; --red-bg:#f3ded8;
    --shadow:0 10px 30px -12px rgba(5,15,36,.45);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:Georgia, 'Spectral', serif; background:var(--paper); color:var(--ink);
    min-height:100vh; padding:32px 16px;
  }
  .wrap{ max-width:820px; margin:0 auto; }
  h1{ font-size:22px; margin:0 0 4px; color:var(--olive-900); }
  p.sub{ color:var(--ink-soft); margin:0 0 22px; font-size:14px; }

  .key-card{
    background:var(--card-bg); border:1px solid var(--rule); border-radius:8px;
    padding:18px; margin-bottom:22px; box-shadow:var(--shadow);
    display:flex; gap:10px; flex-wrap:wrap; align-items:center;
  }
  .key-card input{
    flex:1; min-width:220px; padding:10px 12px; border-radius:5px; border:1px solid var(--rule);
    font-family:'JetBrains Mono', monospace; font-size:13px;
  }
  .key-card button, .filters button{
    padding:10px 16px; border:none; border-radius:5px; cursor:pointer;
    background:var(--olive-800); color:#fff; font-size:13px; letter-spacing:.03em;
  }
  .key-card button:hover, .filters button:hover{ background:var(--olive-900); }

  .filters{ display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
  .filters button.active{ outline:2px solid var(--brass); }

  .status-msg{ font-size:13px; margin-bottom:14px; }
  .status-msg.error{ color:var(--red); }
  .status-msg.ok{ color:var(--green); }

  table{ width:100%; border-collapse:collapse; background:var(--card-bg); border-radius:8px; overflow:hidden; box-shadow:var(--shadow); }
  th, td{ padding:10px 12px; text-align:left; border-bottom:1px solid var(--rule); font-size:13.5px; }
  th{ background:var(--olive-800); color:#fff; font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
  tr:last-child td{ border-bottom:none; }

  .badge{ padding:3px 8px; border-radius:12px; font-size:11px; text-transform:uppercase; letter-spacing:.03em; }
  .badge.pending{ background:#f3e6c8; color:#7a5c12; }
  .badge.approved{ background:var(--green-bg); color:var(--green); }
  .badge.rejected{ background:var(--red-bg); color:var(--red); }
  .badge.banned{ background:#1c1c1c; color:#ff8a8a; }

  .actions button{
    padding:6px 10px; border:none; border-radius:4px; cursor:pointer; font-size:12px; margin-right:6px;
  }
  .btn-approve{ background:var(--green); color:#fff; }
  .btn-reject{ background:var(--red); color:#fff; }
  .btn-ban{ background:#3a0d0d; color:#fff; }
  .btn-unban{ background:var(--olive-800); color:#fff; }
  .empty{ padding:20px; text-align:center; color:var(--ink-soft); font-size:13.5px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Painel do Administrador — Moisés Coelho</h1>
  <p class="sub">Aprove ou negue os cadastros do Banco de Questões CFAP·PMPA. Nenhum e-mail é enviado — a liberação é manual, feita aqui.</p>

  <div class="key-card">
    <input type="password" id="adminKey" placeholder="Chave de administrador (ADMIN_SECRET)">
    <button id="btnLoad">Carregar cadastros</button>
  </div>

  <div class="filters">
    <button data-status="pending" class="active">Pendentes</button>
    <button data-status="approved">Aprovados</button>
    <button data-status="rejected">Rejeitados</button>
    <button data-status="banned">Banidos</button>
    <button data-status="all">Todos</button>
  </div>

  <div class="status-msg" id="statusMsg"></div>
  <table id="table" style="display:none;">
    <thead>
      <tr><th>ID</th><th>Usuário</th><th>Status</th><th>Cadastrado em</th><th>Ações</th></tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<script>
  const adminKeyInput = document.getElementById('adminKey');
  const btnLoad = document.getElementById('btnLoad');
  const tbody = document.getElementById('tbody');
  const table = document.getElementById('table');
  const statusMsg = document.getElementById('statusMsg');
  const filterButtons = document.querySelectorAll('.filters button');

  let currentStatus = 'pending';

  // guarda a chave só em memória da aba (não usa localStorage/sessionStorage)
  function getKey() { return adminKeyInput.value.trim(); }

  function setMsg(text, type) {
    statusMsg.textContent = text || '';
    statusMsg.className = 'status-msg' + (type ? ' ' + type : '');
  }

  async function api(path, opts = {}) {
    const res = await fetch('/api/admin' + path, {
      ...opts,
      headers: {
        'Content-Type': 'application/json',
        'x-admin-key': getKey(),
        ...(opts.headers || {}),
      },
    });
    let data = {};
    try { data = await res.json(); } catch (e) {}
    if (!res.ok) throw new Error(data.error || 'Erro na requisição.');
    return data;
  }

  function badge(status) {
    const label = { pending: 'pendente', approved: 'aprovado', rejected: 'rejeitado', banned: 'banido' }[status] || status;
    return `<span class="badge ${status}">${label}</span>`;
  }

  function actionsFor(u) {
    if (u.status === 'pending') {
      return `<button class="btn-approve" data-id="${u.id}" data-action="approve">Aprovar</button>
        <button class="btn-reject" data-id="${u.id}" data-action="reject">Rejeitar</button>`;
    }
    if (u.status === 'approved') {
      return `<button class="btn-ban" data-id="${u.id}" data-action="ban">Banir</button>`;
    }
    if (u.status === 'banned') {
      return `<button class="btn-unban" data-id="${u.id}" data-action="unban">Desbanir</button>`;
    }
    if (u.status === 'rejected') {
      return `<button class="btn-approve" data-id="${u.id}" data-action="approve">Aprovar</button>`;
    }
    return '—';
  }

  async function loadUsers() {
    if (!getKey()) { setMsg('Informe a chave de administrador.', 'error'); return; }
    setMsg('Carregando...');
    try {
      const data = await api('/users?status=' + currentStatus);
      renderRows(data.users);
      setMsg('');
    } catch (err) {
      table.style.display = 'none';
      setMsg(err.message, 'error');
    }
  }

  function renderRows(users) {
    if (!users.length) {
      table.style.display = 'none';
      setMsg('Nenhum cadastro nesse filtro.', '');
      return;
    }
    table.style.display = 'table';
    tbody.innerHTML = '';
    users.forEach((u) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${u.id}</td>
        <td>${u.username}</td>
        <td>${badge(u.status)}</td>
        <td>${u.created_at}</td>
        <td class="actions">${actionsFor(u)}</td>`;
      tbody.appendChild(tr);
    });
  }

  tbody.addEventListener('click', async (e) => {
    const btn = e.target.closest('button[data-action]');
    if (!btn) return;
    const id = btn.dataset.id;
    const action = btn.dataset.action;
    btn.disabled = true;
    try {
      await api(`/users/${id}/${action}`, { method: 'POST' });
      const messages = {
        approve: 'Usuário aprovado.',
        reject: 'Usuário rejeitado.',
        ban: 'Usuário banido.',
        unban: 'Usuário desbanido.',
      };
      setMsg(messages[action] || 'Ação realizada.', 'ok');
      loadUsers();
    } catch (err) {
      setMsg(err.message, 'error');
      btn.disabled = false;
    }
  });

  filterButtons.forEach((b) => {
    b.addEventListener('click', () => {
      filterButtons.forEach((x) => x.classList.remove('active'));
      b.classList.add('active');
      currentStatus = b.dataset.status;
      loadUsers();
    });
  });

  btnLoad.addEventListener('click', loadUsers);
  adminKeyInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') loadUsers(); });
</script>
</body>
</html>
