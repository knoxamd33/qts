<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Criar conta | Banco de Questões CFAP·PMPA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&family=Bitter:wght@600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#0a1220; --card-bg:#101d33; --rule:#2c4468;
    --accent-ink:#7fb0ff; --ink:#e8edf6; --ink-soft:#9fb3d1;
    --red:#ff6b5b; --red-bg:#3a1a16;
    --green:#3ddc97; --green-bg:#123528;
    --btn:#123367; --btn-hover:#173d78;
    --shadow: 0 10px 34px -12px rgba(0,0,0,.7);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(ellipse at top left, rgba(127,176,255,.06), transparent 55%),
      radial-gradient(ellipse at bottom right, rgba(60,110,200,.14), transparent 55%),
      var(--paper);
    color:var(--ink);
    font-family:'Spectral', Georgia, serif;
    padding:20px;
    -webkit-font-smoothing:antialiased;
  }
  .card{
    width:100%; max-width:420px;
    background:var(--card-bg);
    border:1px solid var(--rule);
    border-radius:10px;
    padding:32px 30px 28px;
    box-shadow:var(--shadow);
  }
  h1{
    font-family:'Bitter', Georgia, serif;
    font-weight:800;
    font-size:24px;
    margin:0 0 8px;
    color:var(--accent-ink);
  }
  p.sub{
    margin:0 0 24px;
    font-size:14px;
    color:var(--ink-soft);
    line-height:1.5;
  }
  label{
    display:block;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--accent-ink);
    margin:0 0 6px;
  }
  .field{ margin-bottom:18px; }
  input{
    width:100%;
    padding:12px 14px;
    border-radius:6px;
    border:1px solid var(--rule);
    background:#0c1728;
    color:var(--ink);
    font-family:'Spectral', Georgia, serif;
    font-size:14.5px;
    outline:none;
    transition:.15s ease;
  }
  input:focus{ border-color:var(--accent-ink); }
  .hint{ font-size:12px; color:var(--ink-soft); margin-top:6px; }
  button[type="submit"]{
    width:100%;
    padding:13px 16px;
    margin-top:6px;
    border:none;
    border-radius:6px;
    background:var(--btn);
    color:#fff;
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    letter-spacing:.08em;
    text-transform:uppercase;
    cursor:pointer;
    transition:.15s ease;
  }
  button[type="submit"]:hover{ background:var(--btn-hover); }
  button[type="submit"]:disabled{ opacity:.6; cursor:default; }
  .switch{
    text-align:center;
    margin-top:18px;
    font-size:13.5px;
    color:var(--ink-soft);
  }
  .switch a{ color:var(--accent-ink); text-decoration:underline; }
  .msg{
    font-size:13px;
    margin-bottom:16px;
    padding:10px 12px;
    border-radius:6px;
    display:none;
  }
  .msg.error{ display:block; color:var(--red); background:var(--red-bg); border:1px solid rgba(255,107,91,.35); }
  .msg.ok{ display:block; color:var(--green); background:var(--green-bg); border:1px solid rgba(61,220,151,.35); }
</style>
</head>
<body>
  <div class="card">
    <h1>Criar conta</h1>
    <p class="sub">Cadastre-se para salvar seu progresso no Banco de Questões. Seu acesso precisa ser aprovado por um administrador antes de você poder entrar.</p>

    <div class="msg" id="msg"></div>

    <form id="registerForm" novalidate>
      <div class="field">
        <label for="username">Nome de usuário</label>
        <input type="text" id="username" name="username" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Senha (mín. 8 caracteres)</label>
        <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" required>
        <div class="hint">Use pelo menos 8 caracteres.</div>
      </div>
      <button type="submit" id="submitBtn">Criar conta</button>
    </form>

    <div class="switch">Já tem conta? <a href="/login.html">Entrar</a></div>
  </div>

<script>
  const form = document.getElementById('registerForm');
  const msg = document.getElementById('msg');
  const submitBtn = document.getElementById('submitBtn');

  function showMsg(text, type){
    msg.textContent = text;
    msg.className = 'msg ' + type;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.className = 'msg';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Enviando...';

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    if (password.length < 8) {
      showMsg('A senha deve ter no mínimo 8 caracteres.', 'error');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Criar conta';
      return;
    }

    try {
      const res = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Não foi possível criar a conta.');

      showMsg(data.message || 'Cadastro enviado! Aguarde a aprovação do administrador.', 'ok');
      form.reset();
      submitBtn.textContent = 'Cadastro enviado';
    } catch (err) {
      showMsg(err.message, 'error');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Criar conta';
    }
  });
</script>
</body>
</html>
